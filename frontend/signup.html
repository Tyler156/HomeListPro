<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account · HomeList Pro</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="auth-page">
  <div class="card">
    <div class="brand-badge" aria-hidden="true">H</div>
    <h1>HomeList Pro</h1>
    <p class="subtitle">Create your account to start managing listings.</p>

    <form id="auth-form" autocomplete="on">
      <label for="full-name">Full name</label>
      <input id="full-name" type="text" required autocomplete="name" placeholder="Jane Doe" />

      <label for="email">Email</label>
      <input id="email" type="email" required autocomplete="email" placeholder="you@example.com" />

      <label for="password">Password</label>
      <input id="password" type="password" required minlength="6" autocomplete="new-password" placeholder="Choose a password" />

      <label for="confirm-password">Confirm password</label>
      <input id="confirm-password" type="password" required minlength="6" autocomplete="new-password" placeholder="Re-enter your password" />

      <div class="button-stack">
        <button id="signup-btn" type="submit">Create account</button>
      </div>
    </form>

    <p class="help-text">Your account will be ready instantly.</p>
    <p class="bottom-note">Already have an account? <a href="login.html" class="bottom-link">Sign in</a></p>
    <div id="message" class="message"></div>
  </div>

  <script type="module">
    import { signUp, redirectIfAuthed } from "./js/auth.js";
    import { saveProfile } from "./js/store.js";

    redirectIfAuthed();

    const form = document.getElementById("auth-form");
    const signupBtn = document.getElementById("signup-btn");
    const fullNameEl = document.getElementById("full-name");
    const emailEl = document.getElementById("email");
    const passwordEl = document.getElementById("password");
    const confirmPasswordEl = document.getElementById("confirm-password");
    const messageEl = document.getElementById("message");

    // display the user friendly error message
    function showError(err) {
      messageEl.className = "message error";
      const code = err.code || "";
      if (code === "auth/email-already-in-use") {
        messageEl.textContent = "That email is already registered. Try signing in instead.";
      } else if (code === "auth/invalid-email") {
        messageEl.textContent = "That email address doesn't look right.";
      } else if (code === "auth/weak-password") {
        messageEl.textContent = "Password must be at least 6 characters.";
      } else if (code === "auth/network-request-failed") {
        messageEl.textContent = "No internet connection. Check your signal and try again.";
      } else {
        messageEl.textContent = "Something went wrong creating your account. Please try again.";
      }
    }

    function clearMessage() {
      messageEl.className = "message";
      messageEl.textContent = "";
    }

    function setBusy(busy) {
      signupBtn.disabled = busy;
    }

    async function handleSubmit() {
      clearMessage();
      const fullName = fullNameEl.value.trim();
      const email = emailEl.value.trim();
      const password = passwordEl.value;
      const confirmPassword = confirmPasswordEl.value;

      if (!fullName || !email || !password || !confirmPassword) return;

      if (password !== confirmPassword) {
        messageEl.className = "message error";
        messageEl.textContent = "Passwords do not match.";
        return;
      }

      setBusy(true);
      try {
        await signUp(email, password, fullName);
        // Write the profile from what was actually typed, rather than leaving
        // the dashboard to infer it from a display name that may not have
        // finished saving yet.
        await saveProfile({ fullname: fullName, email, role: "", company: "", phone: "" });
        window.location.replace("dashboard.html");
      } catch (err) {
        showError(err);
      } finally {
        setBusy(false);
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      handleSubmit();
    });
  </script>
</body>
</html>
