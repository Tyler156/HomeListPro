<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in · HomeList Pro</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="auth-page">
  <div class="card">
    <!-- The top part of the card -->
    <div class="brand-badge" aria-hidden="true">H</div>
    <h1>HomeList Pro</h1>
    <p class="subtitle">Sign in to continue managing your listings.</p>

    <!-- The login form -->
    <form id="auth-form" autocomplete="on">
      <!-- Email box -->
      <label for="email">Email</label>
      <input id="email" type="email" required autocomplete="email" placeholder="you@example.com" />

      <!-- Password box -->
      <label for="password">Password</label>
      <input id="password" type="password" required minlength="6" autocomplete="current-password" placeholder="Enter your password" />

      <!-- Main button -->
      <div class="button-stack">
        <button id="signin-btn" type="submit">Sign in</button>
      </div>
    </form>

    <p class="help-text">Use your HomeList Pro account to keep going.</p>
    <p class="bottom-note">New here? <a href="signup.html" class="bottom-link">Make an account</a></p>
    <div id="message" class="message"></div>
  </div>

  <script type="module">
    import { signIn, redirectIfAuthed } from "./js/auth.js";

    // Check if the user is already signed in.
    redirectIfAuthed();

    // Get the form parts.
    const form = document.getElementById("auth-form");
    const signinBtn = document.getElementById("signin-btn");
    const emailEl = document.getElementById("email");
    const passwordEl = document.getElementById("password");
    const messageEl = document.getElementById("message");

    // Turn Firebase error code into a sentence the user understansds
    function showError(err) {
      messageEl.className = "message error";
      const code = err.code || "";
      if (code === "auth/invalid-credential" || code === "auth/wrong-password" || code === "auth/user-not-found" || code === "auth/invalid-email") {
        messageEl.textContent = "Wrong email or password.";
      } else if (code === "auth/too-many-requests") {
        messageEl.textContent = "Too many attempts. Wait a minute and try again.";
      } else if (code === "auth/network-request-failed") {
        messageEl.textContent = "No internet connection. Check your signal and try again.";
      } else {
        messageEl.textContent = "Something went wrong signing in. Please try again.";
      }
    }

    // Clear the old message.
    function clearMessage() {
      messageEl.className = "message";
      messageEl.textContent = "";
    }

    // Stop the buttons while work is going.
    function setBusy(busy) {
      signinBtn.disabled = busy;
    }

    // Run the sign in or sign up action.
    async function handle(action) {
      clearMessage();
      if (!emailEl.value || !passwordEl.value) return;
      setBusy(true);
      try {
        await action(emailEl.value, passwordEl.value);
        window.location.replace("dashboard.html");
      } catch (err) {
        showError(err);
      } finally {
        setBusy(false);
      }
    }

    // Sign in when the form is sent.
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      handle(signIn);
    });
  </script>
</body>
</html>
